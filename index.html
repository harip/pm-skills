<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Workflow — V-Model</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 24px; background: #f7f9fb; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 1024px; padding: 32px; background: #fff; border: 1px solid #dce5f1; border-radius: 24px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / .10), 0 8px 10px -6px rgb(0 0 0 / .10); }
    .audit-strip { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 12px; padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 14px; background: #fff; color: #334155; font: inherit; font-size: 11px; font-weight: 650; cursor: pointer; }
    .audit-strip span:last-child { color: #64748b; font-weight: 500; }
    .audit-strip:hover, .audit-strip.selected { border-color: #64748b; background: #f8fafc; }
    .audit-strip:focus-visible { outline: 3px solid #64748b; outline-offset: 3px; }
    .v-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 24px; padding: 16px; background: #f7f9fb; border: 1px solid #dce5f1; border-radius: 18px; }
    .phase-column { --accent: #2563ff; --line: #dbe5f3; --badge-bg: #dbeafe; --badge-text: #1d4ed8; }
    .implementation { --accent: #9333ff; --line: #e9d5ff; --badge-bg: #f3e8ff; --badge-text: #7e22ce; }
    .validation { --accent: #00a36c; --badge-bg: #d1fae5; --badge-text: #047857; }
    .phase-column h2 { margin: 0 0 16px; padding: 0 0 8px; border-bottom: 1px solid var(--line); color: var(--accent); text-align: center; text-transform: uppercase; font-size: 12px; line-height: 16px; font-weight: 650; letter-spacing: 1px; }
    .validation h2 { border-color: #d1fae5; }
    .phase-cards { display: grid; gap: 16px; }
    .role-card { display: block; width: 100%; height: 74px; padding: 14px; border: 1px solid var(--line); border-radius: 17px; background: #fff; color: #1e293b; text-align: left; font: inherit; cursor: pointer; }
    .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 24px; }
    .card-role { font-size: 12px; font-weight: 650; white-space: nowrap; }
    .badge { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; color: var(--badge-text); background: var(--badge-bg); font-size: 13px; font-weight: 700; }
    .card-label { display: block; margin-top: 4px; color: #586174; font-size: 10px; line-height: 14px; letter-spacing: .25px; }
    .role-card.selected { background: #2563eb; color: #fff; border-color: #60a5fa; box-shadow: 0 0 0 1px #93c5fd, 0 3px 5px rgb(15 23 42 / .12); }
    .selected .badge { background: #fff; color: #2563ff; }
    .selected .card-label { color: #dbeafe; font-weight: 600; }
    .role-card:hover:not(.selected) { border-color: var(--accent); }
    .role-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .detail { display: flex; align-items: center; gap: 12px; min-height: 68px; margin-top: 24px; padding: 14px 16px; border: 1px solid #b9d6ff; border-radius: 17px; background: #eff6ff; }
    .detail .test-mapping { margin-top: 5px; color: #1d4ed8; font-size: 11px; }
    .detail-icon { font-size: 22px; line-height: 28px; }
    .detail h2 { margin: 0; color: #0f172a; font-size: 12px; line-height: 18px; font-weight: 650; }
    .detail p { margin: 0; color: #475569; font-size: 12px; line-height: 18px; letter-spacing: .1px; }
    @media (max-width: 760px) {
      body { display: block; padding: 24px 12px; overflow-x: auto; }
      main { min-width: 700px; padding: 24px; }
      .v-grid { gap: 16px; padding: 12px; }
      .audit-strip { gap: 20px; }
      .role-card { padding: 12px; }
      .card-role { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main aria-label="PM workflow visualizer">
    <div id="vModelContainer"></div>
    <noscript>Enable JavaScript to explore the workflow.</noscript>
  </main>
  <script src="app.js"></script>
</body>
</html>
